name: Student installers
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Build verified payloads or signed installers
        type: choice
        options: [payload, package]
        default: payload
      target:
        description: Native target
        type: choice
        options: [all, macos-x64, macos-arm64, windows-x64]
        default: all
      payload_run:
        description: Validated payload workflow run ID (package only)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: student-delivery-${{ inputs.stage }}-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  delivery:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'macos-x64' && '["macos-x64"]' || inputs.target == 'macos-arm64' && '["macos-arm64"]' || inputs.target == 'windows-x64' && '["windows-x64"]' || '["macos-x64","macos-arm64","windows-x64"]') }}
    runs-on: ${{ matrix.target == 'macos-x64' && 'macos-15-intel' || matrix.target == 'macos-arm64' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Free only unused preinstalled tools on this disposable macOS runner
        if: runner.os == 'macOS'
        run: |
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
            sudo rm -rf /Applications/Xcode*.app
          else
            selected=$(cd "$(xcode-select -p)/../.." && pwd -P)
            for xcode in /Applications/Xcode*.app; do
              if [ ! -L "$xcode" ] && [ "$xcode" != "$selected" ]; then sudo rm -rf "$xcode"; fi
            done
          fi
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator
          df -h .
      - name: Verify approved source
        run: python bootstrap_source.py
      - name: Check shell and install packaging tools
        working-directory: student-source/apps/desktop
        run: npm ci && npm run check && npm test
      - name: Ensure Windows installer compiler
        if: runner.os == 'Windows' && inputs.stage == 'package'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) { choco install nsis --version=3.12 --yes --no-progress }
      - name: Verify Windows resource part checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test-payload.ps1
      - name: Assemble and validate native delivery
        run: python delivery.py --target ${{ matrix.target }} --stage ${{ inputs.stage }} --payload-run '${{ inputs.payload_run }}'
