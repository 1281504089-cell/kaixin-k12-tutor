name: Reverify frozen Intel candidate installation
on:
  push:
    branches: ['codex/k12-native-reverify-20261117-*']
permissions:
  contents: write
  actions: read
jobs:
  native:
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate recheck locks and QA entry names
        run: |
          python -m unittest test_mac_reuse
          node ci-k12-driver-selfcheck.cjs
      - name: Recheck the same frozen core in the Intel installation package
        run: |
          python - <<'PYTHON'
          from base64 import b64decode
          from hashlib import sha256
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen
          from zipfile import ZipFile
          url = 'https://raw.githubusercontent.com/1281504089-cell/kaixin-k12-tutor/029f57f6a3575a6b30ac6142a4d6de539a709c40/releases/student-20261121-resource-4-native-intel-recovery.txt'
          with urlopen(url, timeout=55) as response:
              archive = b64decode(response.read(150000).strip(), validate=True)
          assert sha256(archive).hexdigest() == '7ca2f75abdedfb0c9014941dedf2d2c052eeee07b18441c5b531bc1c87687ad3'
          recipe = Path('resource-native-recipe')
          recipe.mkdir()
          with ZipFile(BytesIO(archive)) as bundle:
              assert all(Path(name).name == name for name in bundle.namelist())
              bundle.extractall(recipe)
          repackage = recipe / 'ci_repackage.py'
          checks = repackage.read_text(encoding='utf-8')
          line = "run('/usr/bin/codesign', '--verify', '--deep', '--strict', app, timeout=240)"
          assert checks.count(line) == 2
          # The Intel runner can spend over four minutes hashing the app bundle.
          checks = checks.replace(line, line.replace('timeout=240', 'timeout=900'))
          compile(checks, str(repackage), 'exec')
          repackage.write_text(checks, encoding='utf-8')
          PYTHON
          python resource-native-recipe/diagram_ci.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachments-${{ matrix.target }}
          path: fresh-evidence/${{ matrix.target }}/
          if-no-files-found: error
