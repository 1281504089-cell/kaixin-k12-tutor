name: Reverify exact immutable batch6 Windows candidate
on:
  push:
    branches: ['codex/k12-windows6-reverify-20261118-*']
permissions:
  contents: write
  actions: read
jobs:
  windows:
    name: native (windows-x64, windows-2025)
    timeout-minutes: 150
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      KX_REUSE_LOCK_SHA256: b6f70eb21078bed73002d19bc8b13accc724fc8f9e46a9107b9c4fd93a0ca3d9
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require owner-frozen Windows6 lock before any accepted update request
        run: |
          python -c "import hashlib,json,os,re; p='windows-k12-6-reuse-lock.json'; raw=open(p,'rb').read(); d=json.loads(raw); assert d.get('execution_frozen') is True; assert re.fullmatch(r'[a-f0-9]{64}',os.environ['KX_REUSE_LOCK_SHA256']) and hashlib.sha256(raw).hexdigest()==os.environ['KX_REUSE_LOCK_SHA256']"
      - name: Preserve legacy guards and require strict batch6 substitutions to fail
        run: |
          python -m unittest test_mac_reuse test_k12_5_reuse test_windows6_reuse
          node ci-k12-driver-selfcheck.cjs
          node update-flow-selfcheck.cjs
          node update-flow-disposal-selfcheck.cjs
          node update-flow-backup-selfcheck.cjs
          node math-baseline-selfcheck.cjs
      - name: Fresh install and rerun all four complete Windows update routes
        run: python ci-mac-reuse.py --target windows-x64 --release-tag student-20261117-k12-6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachments-windows-x64
          path: fresh-evidence/windows-x64/
          if-no-files-found: error
