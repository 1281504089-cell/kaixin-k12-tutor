name: Complete current student installers
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Refresh all features into full payloads, or package signed payloads
        type: choice
        options: [refresh, package]
        default: refresh
      target:
        description: Native target
        type: choice
        options: [all, macos-x64, macos-arm64, windows-x64]
        default: all
      payload_run:
        description: Refreshed payload run ID (package only)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: student-complete-${{ inputs.stage }}-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  complete:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'macos-x64' && '["macos-x64"]' || inputs.target == 'macos-arm64' && '["macos-arm64"]' || inputs.target == 'windows-x64' && '["windows-x64"]' || '["macos-x64","macos-arm64","windows-x64"]') }}
    runs-on: ${{ matrix.target == 'macos-x64' && 'macos-15-intel' || matrix.target == 'macos-arm64' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Free only unused preinstalled tools on this disposable macOS runner
        if: runner.os == 'macOS'
        run: |
          enough_space() { python -c 'import shutil,sys; sys.exit(0 if shutil.disk_usage(".").free >= 35*1024**3 else 1)'; }
          if enough_space; then df -h .; exit 0; fi
          selected=$(cd "$(xcode-select -p)/../.." && pwd -P)
          if [ -d /Library/Developer/CommandLineTools ]; then
            sudo xcode-select -s /Library/Developer/CommandLineTools
            selected=''
          fi
          for xcode in /Applications/Xcode*.app; do
            if [ ! -L "$xcode" ] && [ "$xcode" != "$selected" ]; then sudo rm -rf "$xcode"; fi
            if enough_space; then break; fi
          done
          df -h .
          enough_space
      - name: Reconstruct and verify every approved feature patch
        env:
          STAGE: ${{ inputs.stage }}
          TARGET: ${{ matrix.target }}
        run: |
          python bootstrap_source.py --with-updates
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path('student-source/SOURCE_FREEZE.json'); freeze=json.loads(p.read_text())
          freeze['frozenBaseCommit']=freeze['commit']
          commit=os.environ['GITHUB_SHA'] if os.environ['STAGE']=='refresh' else json.loads(Path('delivery-signed-'+os.environ['TARGET']+'.json').read_text())['commit']
          assert re.fullmatch('[a-f0-9]{40}',commit)
          freeze['commit']=commit; p.write_text(json.dumps(freeze,indent=2)+'\n')
          PY
          git -C student-source add SOURCE_FREEZE.json
          git -C student-source commit -m 'Record complete installer source identity'
      - name: Check desktop shell and Chinese first launch
        working-directory: student-source/apps/desktop
        run: npm ci && npm run check && npm test
      - name: Ensure Windows installer compiler
        if: runner.os == 'Windows' && inputs.stage == 'package'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) { choco install nsis --version=3.12 --yes --no-progress }
      - name: Build and validate full installer delivery
        run: python delivery.py --target ${{ matrix.target }} --stage ${{ inputs.stage }} --payload-run '${{ inputs.payload_run }}'
