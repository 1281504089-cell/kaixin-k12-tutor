name: Validate frozen K12 candidate on three native platforms
on:
  push:
    branches: ['codex/k12-native-20261116-*', 'codex/k12-native-20261117-*']
permissions:
  contents: write
jobs:
  native:
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-26
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require owner-signed same-source candidate inputs
        shell: bash
        run: |
          python -c 'import json; c=json.load(open("attachment-release.json")); b=json.load(open("attachment-batch.json")); assert c.get("prepared") is True; assert b["tag"]==c["tag"] and b["core_commit"]==c["source_commit"]; assert b["tag"].startswith(("student-20261116-", "student-20261117-")); assert all(m["commit"]==c["source_commit"] and m["archive"]==c["archive"] for m in b["manifests"].values())'
      - name: Record native candidate run
        shell: bash
        env:
          KX_TARGET: ${{ matrix.target }}
        run: |
          python -c 'import json,os;open("native-run-"+os.environ["KX_TARGET"]+".json","w").write(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
          tag=$(python -c 'import json;print(json.load(open("attachment-batch.json"))["tag"])')
          gh release upload "$tag" "native-run-${KX_TARGET}.json" --clobber
      - name: Check immutable installer reuse and native display guards
        run: |
          python -m unittest test_native_reuse_metadata test_native_reuse_inputs test_installer_segments test_native_pages_proof
          node ci-k12-driver-selfcheck.cjs
          node native-response-followup-selfcheck.cjs
          node native-visibility-selfcheck.cjs
          node native-click-followup-selfcheck.cjs
          node update-flow-selfcheck.cjs
          node update-flow-disposal-selfcheck.cjs
          node update-flow-backup-selfcheck.cjs
      - name: Prepare Windows packaging tool
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Verify bounded progress and same-account math fixture checks
        run: |
          node progress-read-selfcheck.cjs
          node math-baseline-selfcheck.cjs
          node ci-student-controls-navigation-selfcheck.cjs
          node ci-k12-session-diagnostics-selfcheck.cjs
          node ci-materials-navigation-selfcheck.cjs
      - name: Verify fresh install, background indexing, bridge, and real update IPC
        run: python ci-fresh-install.py --target ${{ matrix.target }}
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachments-${{ matrix.target }}
          path: fresh-evidence/${{ matrix.target }}/
          if-no-files-found: error
