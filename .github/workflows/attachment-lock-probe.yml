name: Verify native Windows upload queue locks
on:
  push:
    branches: ['codex/attachments-lockprobe-20261114-*']
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ci-lock-probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-lease
          path: lease-probe.json
