name: Rebuild and verify k12-18 native full installers
on:
  push:
    branches: ['codex/k12-fresh-20261117-18*']
permissions:
  contents: write
jobs:
  validate:
    timeout-minutes: 260
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-26
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Build and start a fresh native install
        run: python ci-fresh-install.py --target ${{ matrix.target }} --inputs . --work native-work
      - name: Stage only verified files in the versioned release
        run: python stage-verified-installers.py --target ${{ matrix.target }} --inputs . --work native-work
      - name: Retain original native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-k12-18-${{ matrix.target }}
          path: native-work/evidence/
          if-no-files-found: warn
