name: Windows installer verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare official NSIS compiler
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) { choco install nsis --version=3.12 --yes --no-progress }
      - name: Exercise actual installer with small verified resource parts
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: python windows_installer_probe.py
