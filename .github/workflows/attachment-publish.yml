name: Owner-only promotion after the complete K12 native matrix
on:
  push:
    branches: ['codex/k12-publish-20261117-*']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record publication run
        run: |
          python -c 'import json,os;b=json.load(open("attachment-publication.json"));assert b.get("prepared") is True and b["tag"]=="student-20261117-k12-2";open("publication-run.json","w").write(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
      - name: Verify three native proofs and switch signed batch
        run: python ci-promote-attachments.py
      - name: Keep publication receipts and previous defaults
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-publication-receipt
          path: |
            PUBLICATION-RECEIPT.json
            PUBLICATION-TRANSACTION.json
            publication-run.json
            publication-work/previous/
          if-no-files-found: warn
