name: 9c019338 verified desktop bridge assembly
on:
  push:
    branches: [codex/desktop-native-qa-9c019338]
    paths: [".github/workflows/bridge-build-9c019338.yml", "qa/bridge-9c019338/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain the verified compatibility archive in the isolated draft
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TARGET: ${{ matrix.target }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 qa/bridge-9c019338/assemble.py "$QA_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-assembly-9c019338-${{ matrix.target }}
          path: bridge-evidence/
          retention-days: 7
