name: Reverify immutable Intel5 with the accepted native stage
on:
  push:
    branches: ['codex/k12-existing5-20261117-*']
permissions:
  contents: write
  actions: read
jobs:
  native:
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen current and predecessor contracts
        run: |
          python -m unittest test_mac_reuse test_k12_5_reuse test_partial_native_evidence test_native_pages_proof test_installer_segments
          node ci-k12-driver-selfcheck.cjs
          node native-response-followup-selfcheck.cjs
          node native-visibility-selfcheck.cjs
          node native-click-followup-selfcheck.cjs
          node update-flow-selfcheck.cjs
      - name: Reverify existing installers and bridge without packaging or signing
        run: python ci-mac-reuse.py --target macos-x64 --release-tag student-20261117-k12-5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachments-${{ matrix.target }}
          path: fresh-evidence/${{ matrix.target }}/
          if-no-files-found: error
