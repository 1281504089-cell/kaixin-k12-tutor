name: Reverify exact immutable batch7 Intel candidate
on:
  push:
    branches: ['codex/k12-intel7-reverify-20261118-*']
permissions:
  contents: write
  actions: read
jobs:
  intel:
    name: native (macos-x64, macos-15-intel)
    timeout-minutes: 150
    runs-on: macos-15-intel
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      KX_REUSE_LOCK_SHA256: 0c7d4bc1a981f3db251ba49ee899436efe465f6846965a4346c2fd865c194f79
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require owner-frozen Intel7 lock before any network or accepted request
        run: |
          python -c "from pathlib import Path; from batch7_recheck import validate_intel7_execution; validate_intel7_execution(Path.cwd(),Path('intel-k12-7-reuse-lock.json').read_bytes())"
      - name: Preserve immutable recheck and native display guards
        run: |
          python -m unittest test_mac_reuse test_k12_5_reuse test_intel7_reuse
          node ci-k12-driver-selfcheck.cjs
          node ci-k12-session-diagnostics-selfcheck.cjs
          node native-response-followup-selfcheck.cjs
          node native-visibility-selfcheck.cjs
          node native-click-followup-selfcheck.cjs
          node update-flow-selfcheck.cjs
          node update-flow-disposal-selfcheck.cjs
          node update-flow-backup-selfcheck.cjs
          node progress-read-selfcheck.cjs
          node math-baseline-selfcheck.cjs
      - name: Fresh install and rerun all four complete Intel update routes
        run: python ci-mac-reuse.py --target macos-x64 --release-tag student-20261117-k12-7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attachments-macos-x64
          path: fresh-evidence/macos-x64/
          if-no-files-found: error
