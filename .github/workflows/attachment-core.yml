name: Build signed desktop updater core
on:
  push:
    branches: ['codex/updater-core-20261115-*']
    paths: ['attachment-release.json', 'ci-attachment-core.py', 'student-chat-audio-20261114.patch', 'source-manifest.json', '.github/workflows/attachment-core.yml']
permissions:
  contents: write
  actions: write
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop superseded candidate validation
        run: |
          gh api repos/${{ github.repository }}/actions/runs/43697892268 > superseded-run.json
          python -c 'import json;d=json.load(open("superseded-run.json"));assert d["head_sha"]=="ddaa7b3078c6fcd6f5bb081ac1a2c7471eb9e29d" and d["head_branch"]=="codex/updater-native-20261115-preview-b"'
          if [ "$(python -c 'import json;print(json.load(open("superseded-run.json"))["status"])')" != "completed" ]; then
            gh api -X POST repos/${{ github.repository }}/actions/runs/43697892268/cancel
          fi
      - name: Create isolated prerelease
        run: |
          set -euo pipefail
          tag=$(python -c 'import json;print(json.load(open("attachment-release.json"))["tag"])')
          if gh release view "$tag" --json isPrerelease > current.json 2>/dev/null; then
            python -c 'import json;assert json.load(open("current.json"))["isPrerelease"], "Never overwrite a final release"'
          else
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title '聊天快速预览候选 · 2026-11-15' --notes '正在验证消息快速预览、三端完整安装、检查更新和记录保留。尚未发布正式版。'
          fi
      - name: Record candidate run
        run: |
          python -c 'import json,os;open("core-run.json","w").write(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
          tag=$(python -c 'import json;print(json.load(open("attachment-release.json"))["tag"])')
          gh release upload "$tag" core-run.json --clobber
      - name: Build and verify core
        run: python ci-attachment-core.py
      - name: Keep core receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-core
          path: attachment-core/attachment-core.json
          if-no-files-found: warn
