name: Rebuild the three pinned k12-18 universal bridges
on:
  push:
    branches: ['codex/k12-core-20261117-18-bridge-r2*']
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        target: [macos-arm64, macos-x64, windows-x64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and read back only this target
        run: python ci-bridge-r2.py --target ${{ matrix.target }} --output bridge-output --stage
      - name: Save authenticated byte-level receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-r2-${{ matrix.target }}
          path: bridge-output/bridge-r2-${{ matrix.target }}.json
          if-no-files-found: warn
