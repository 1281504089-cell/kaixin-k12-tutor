name: Windows archive compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise Unicode archive formats and native Windows locales
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: python windows_archive_probe.py
