name: Continue exact ARM8 candidate after accepted original health sample
on:
  push:
    branches: ['codex/arm8-health-continue-20261118-*']
permissions:
  contents: write
  actions: read
jobs:
  native:
    name: native (macos-arm64, macos-15)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      KX_NATIVE_ACCEPTED_HEALTH: native8-arm-health-acceptance.json
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require owner-signed same-source candidate inputs
        shell: bash
        run: |
          python -c 'import json; c=json.load(open("attachment-release.json")); b=json.load(open("attachment-batch.json")); assert c.get("prepared") is True; assert b["tag"]==c["tag"] and b["core_commit"]==c["source_commit"]; assert b["tag"]=="student-20261117-k12-8"; assert all(m["commit"]==c["source_commit"] and m["archive"]==c["archive"] for m in b["manifests"].values())'
      - name: Check exact acceptance, original failed job, and immutable inputs
        shell: bash
        run: |
          python -m unittest test_native8_health_acceptance test_native_reuse_metadata test_native_reuse_inputs test_installer_segments test_native_pages_proof
          gh api repos/$GH_REPO/actions/runs/44285382021 > native8-original-run.json
          gh api repos/$GH_REPO/actions/jobs/134736575809 > native8-original-job.json
          gh api repos/$GH_REPO/actions/artifacts/14419846998 > native8-original-artifact.json
          python -c 'import json;from ci_native8_health_acceptance import verify_remote_identity,validate_original;load=lambda p:json.load(open(p));verify_remote_identity(load("native8-original-run.json"),load("native8-original-job.json"),load("native8-original-artifact.json"));b=load("attachment-batch.json");validate_original("native8-arm-health-acceptance.json","native8-arm-health-original.zip","macos-arm64",b,b["manifests"]["macos-arm64"])'
      - name: Record only continued ARM staging run and preserve original marker
        shell: bash
        run: |
          tag=student-20261117-k12-8
          mkdir original-arm-marker
          gh release download "$tag" --pattern native-run-macos-arm64.json --dir original-arm-marker
          python -c 'import json,os;from pathlib import Path;p=Path("original-arm-marker/native-run-macos-arm64.json");v=json.loads(p.read_text());assert v=={"run_id":44285382021,"workflow_commit":"daaa73733855075857e89e833712d5568a459ddb"};Path("native8-original-arm-run-44285382021.json").write_bytes(p.read_bytes());Path("native-run-macos-arm64.json").write_text(json.dumps({"run_id":int(os.environ["GITHUB_RUN_ID"]),"workflow_commit":os.environ["GITHUB_SHA"]}))'
          gh release upload "$tag" native8-original-arm-run-44285382021.json
          gh release upload "$tag" native-run-macos-arm64.json --clobber
      - name: Keep real native interaction and four upgrade guards
        shell: bash
        run: |
          node ci-k12-driver-selfcheck.cjs
          node native-response-followup-selfcheck.cjs
          node native-visibility-selfcheck.cjs
          node native-click-followup-selfcheck.cjs
          node update-flow-selfcheck.cjs
          node update-flow-disposal-selfcheck.cjs
          node update-flow-backup-selfcheck.cjs
          node progress-read-selfcheck.cjs
          node math-baseline-selfcheck.cjs
          node ci-student-controls-navigation-selfcheck.cjs
          node ci-k12-session-diagnostics-selfcheck.cjs
          node ci-materials-navigation-selfcheck.cjs
      - name: Reuse exact ARM8 installers and complete remaining native acceptance
        run: python ci-fresh-install.py --target macos-arm64 --lock-file fresh-install-lock-arm8-health.json
      - name: Retain continued evidence with original failure provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachments-macos-arm64
          path: fresh-evidence/macos-arm64/
          if-no-files-found: error
