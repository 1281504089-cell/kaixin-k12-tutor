name: 9719ddda signed desktop native acceptance
on:
  push:
    branches: [codex/desktop-native-qa-5af77432]
    paths: [".github/workflows/native-9719ddda.yml", "qa/native-9719ddda/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholar-9719ddda-native-intel-physical-handoff
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure the existing Windows packaging helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install the locked desktop UI test driver
        shell: bash
        run: npm install --no-save --no-package-lock --prefix qa/native-9719ddda playwright-core@1.57.0
      - name: Check source, true restart, recovery and empty-profile installation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TARGET: ${{ matrix.target }}
          QA_PHYSICAL_INTEL: "1"
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python qa/native-9719ddda/run_native.py "$QA_TARGET" --evidence native-9719ddda-evidence --retain-verified-media
      - name: Bind the freshly installed physical test media
        uses: actions/upload-artifact@v4
        with:
          name: physical-intel-9719ddda-input
          path: native-9719ddda-evidence/physical-intel-pending.json
          retention-days: 2
          if-no-files-found: error
      - name: Transfer Intel installation volume 1
        uses: actions/upload-artifact@v4
        with:
          name: physical-intel-9719ddda-volume-1
          path: ${{ env.TESTED_INTEL_DIR }}/*-part.dmg
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Transfer Intel installation volume 2
        uses: actions/upload-artifact@v4
        with:
          name: physical-intel-9719ddda-volume-2
          path: ${{ env.TESTED_INTEL_DIR }}/*.002.dmgpart
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Transfer Intel installation volume 3
        uses: actions/upload-artifact@v4
        with:
          name: physical-intel-9719ddda-volume-3
          path: ${{ env.TESTED_INTEL_DIR }}/*.003.dmgpart
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Transfer Intel installation volume 4
        uses: actions/upload-artifact@v4
        with:
          name: physical-intel-9719ddda-volume-4
          path: ${{ env.TESTED_INTEL_DIR }}/*.004.dmgpart
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Transfer Intel installation volume 5
        uses: actions/upload-artifact@v4
        with:
          name: physical-intel-9719ddda-volume-5
          path: ${{ env.TESTED_INTEL_DIR }}/*.005.dmgpart
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Verify signed on-device results for these exact five volumes
        run: python qa/native-9719ddda/physical_finish.py native-9719ddda-evidence
      - name: Retain each exact accepted installer in the isolated draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TARGET: ${{ matrix.target }}
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python qa/native-9719ddda/retain_verified_media.py "$QA_TARGET" --evidence native-9719ddda-evidence
      - name: Retain diagnostic and native test proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-9719ddda-${{ matrix.target }}
          path: |
            native-9719ddda-evidence/*.json
            native-9719ddda-evidence/*.jsonl
            native-9719ddda-evidence/*.log
          retention-days: 7
