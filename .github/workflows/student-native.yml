name: Student native runtime validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build
        type: choice
        options: [all, macos-arm64, windows-x64]
        default: all

permissions:
  contents: write

concurrency:
  group: student-native-${{ inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'macos-arm64' && '["macos-arm64"]' || inputs.target == 'windows-x64' && '["windows-x64"]' || '["macos-arm64","windows-x64"]') }}
    runs-on: ${{ matrix.target == 'macos-arm64' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: astral-sh/setup-uv@v6
      - name: Verify approved frozen source
        run: python bootstrap_source.py
      - name: Download public-only common resources from this private repository
        run: |
          mkdir -p native-inputs
          gh release download build-resources-20261106 --repo "$GITHUB_REPOSITORY" --pattern native-common-resources.tar.gz --dir native-inputs
      - name: Prepare locked native resources
        working-directory: student-source
        run: |
          python ../prepare_native.py --target ${{ matrix.target }} --common ../native-inputs/native-common-resources.tar.gz --common-sha256 29bcabea7c9dda368d73dbdda4933a120e0649ce4d1396a89ada386f4266b367
      - name: Check desktop shell
        working-directory: student-source/apps/desktop
        run: npm ci && npm run check && npm test
      - name: Build native Python, Node and frontend payload
        working-directory: student-source/apps/desktop
        run: npm run build:runtime -- --target ${{ matrix.target }} --new-key
      - name: Exercise parsing, OCR, retrieval, speech, charts and animation
        working-directory: student-source
        run: node ../verify_native.mjs --target ${{ matrix.target }}
      - name: Boot, serve and shut down with developer tools hidden
        working-directory: student-source/apps/desktop
        run: npm run smoke -- --target ${{ matrix.target }}
      - name: Keep verified native payload for local textbook merge and signing
        working-directory: student-source/apps/desktop
        env:
          RELEASE_TAG: native-${{ github.run_id }}-${{ matrix.target }}
        run: |
          python -c "from pathlib import Path; p=Path('.local/${{ matrix.target }}/seed'); assert all(x.stat().st_size < 2*1024**3 for x in p.iterdir() if x.is_file()), 'Payload exceeds Release file limit'"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Native validation ${{ matrix.target }} / ${{ github.run_id }}" --prerelease --notes "Internal native payload, not a student installer. No model API keys, student records or textbook originals. Textbooks and the maintainer signature are merged locally before delivery."
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" .local/${{ matrix.target }}/seed/* assets/runtime-public.pem .local/${{ matrix.target }}/smoke-result.json .local/${{ matrix.target }}/native-evidence/*.json
